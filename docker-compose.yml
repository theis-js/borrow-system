  #    ports:
  #      - "8003:80"
  #    restart: unless-stopped

  backend:
    container_name: borrow_system-backend
    build: ./backend
    ports:
      - "8002:8002"
    environment:
      NODE_ENV: production
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: borrow_system
    depends_on:
      - mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8002/server-info"]
      interval: 30s
      timeout: 5s
      retries: 3

  backend_v2:
    container_name: borrow_system-backend_v2
    build: ./backendV2
    ports:
      - "8004:8004"
    environment:
      NODE_ENV: production
      DB_HOST: mysql_v2
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD_V2}
      DB_NAME: borrow_system_v2
    depends_on:
      - mysql_v2
    restart: unless-stopped

  mysql:
    container_name: borrow_system-mysql
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: borrow_system
      TZ: Europe/Berlin
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql-timezone.cnf:/etc/mysql/conf.d/timezone.cnf:ro
    ports:
      - "3309:3306"

  mysql_v2:
    container_name: borrow_system-mysql-v2
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD_V2}
      MYSQL_DATABASE: borrow_system_v2
      TZ: Europe/Berlin
    volumes:
      - mysql-v2-data:/var/lib/mysql
      - ./mysql-timezone.cnf:/etc/mysql/conf.d/timezone.cnf:ro
    ports:
      - "3310:3306"

volumes:
  mysql-data:
  mysql-v2-data:
