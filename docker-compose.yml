  borrow_system-backend:
    container_name: borrow_system-backend
    build: ./backend
    ports:
      - "8002:8002"
    environment:
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: borrow_system
    depends_on:
      - mysql
    volumes:
      - ./backend:/borrow_system-backend
    restart: unless-stopped

  mysql:
    container_name: borrow_system-mysql
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: borrow_system
      TZ: Europe/Berlin
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql-timezone.cnf:/etc/mysql/conf.d/timezone.cnf:ro
    ports:
      - "3309:3306"

  mysql-new:
    container_name: borrow_system-mysql-new
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: borrow_system_new
      TZ: Europe/Berlin
    volumes:
      - mysql-data-new:/var/lib/mysql
      - ./mysql-timezone.cnf:/etc/mysql/conf.d/timezone.cnf:ro
    ports:
      - "3310:3306"

volumes:
  mysql-data:
  mysql-data-new:
