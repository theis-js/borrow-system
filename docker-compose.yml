services:
  demo_usr_frontend:
    container_name: demo_borrow_system-usr-frontend
    networks:
      proxynet:
        ipv4_address: 172.20.0.51
    build: ./FrontendV2
    restart: unless-stopped

  demo_admin_frontend:
    container_name: demo_borrow_system-admin-frontend
    networks:
      proxynet:
        ipv4_address: 172.20.0.52
    build: ./admin
    restart: unless-stopped

  demo_backend_v2:
    container_name: demo_borrow_system-backend_v2
    networks:
      proxynet:
        ipv4_address: 172.20.0.50
    build: ./backendV2
    environment:
      NODE_ENV: production
      DB_HOST: demo_mysql_v2
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD_V2}
      DB_NAME: borrow_system_new
    depends_on:
      - demo_mysql_v2
    restart: unless-stopped

  demo_mysql_v2:
    container_name: demo_borrow_system-mysql-v2
    networks:
      proxynet:
        ipv4_address: 172.20.0.53
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD_V2}
      MYSQL_DATABASE: borrow_system_new
      TZ: Europe/Berlin
    volumes:
      - demo_mysql-v2-data:/var/lib/mysql
      - ./mysql-timezone.cnf:/etc/mysql/conf.d/timezone.cnf:ro

  no-as-a-service:
    container_name: demo_borrow_system-naas
    networks:
      proxynet:
        ipv4_address: 172.20.0.54
    build:
      context: ./no-as-a-service
      dockerfile: Dockerfile
    restart: always

volumes:
  mysql-data:
  demo_mysql-v2-data:

networks:
  proxynet:
    external: true
