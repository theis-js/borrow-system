  demo_backend_v2:
    container_name: demo_borrow_system-backend_v2
    networks:
      - proxynet
    build: ./backendV2
    environment:
      NODE_ENV: production
      DB_HOST: demo_mysql_v2
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD_V2}
      DB_NAME: borrow_system_new
    depends_on:
      - mysql_v2
    restart: always

  demo_mysql_v2:
    container_name: demo_borrow_system-mysql-v2
    networks:
      - proxynet
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD_V2}
      MYSQL_DATABASE: borrow_system_new
      TZ: Europe/Berlin
    volumes:
      - demo_mysql-v2-data:/var/lib/mysql
      - ./mysql-timezone.cnf:/etc/mysql/conf.d/timezone.cnf:ro
    ports:
      - "3310:3306"

  no-as-a-service:
    container_name: borrow_system-naas
    ports:
      - "3000:3000"
    build:
      context: ./no-as-a-service
      dockerfile: Dockerfile
    restart: always

volumes:
  mysql-data:
  demo_mysql-v2-data:

networks:
  proxynet:
    external: true
