services:
  usr-frontend:
    container_name: borrow-system_usr-frontend
    build: ./frontend
    environment:
      VITE_BACKEND_URL: ${BACKEND_URL}
    restart: always

  admin-frontend:
    container_name: borrow-system_admin-frontend
    build: ./admin
    environment:
      VITE_BACKEND_URL: ${BACKEND_URL}
    restart: always

  backend:
    container_name: borrow-system_backend
    build: ./backend
    environment:
      NODE_ENV: production
      DB_HOST: borrow-system_mysql
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: borrow_system_new
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USER: ${MAIL_USER}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_SENDEES_CONTACT: ${MAIL_SENDEES_CONTACT}
      MAIL_SENDEES: ${MAIL_SENDEES}
      NAAS_URL: ${NAAS_URL}
    depends_on:
      - mysql
    restart: always

  mysql:
    container_name: borrow-system_mysql
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: borrow_system_new
      TZ: Europe/Berlin
    volumes:
      - mysql-v2-data:/var/lib/mysql
      - ./mysql-timezone.cnf:/etc/mysql/conf.d/timezone.cnf:ro

  no-as-a-service:
    container_name: borrow-system_naas
    build:
      context: ./no-as-a-service
      dockerfile: Dockerfile
    restart: always

volumes:
  mysql-data:
  mysql-v2-data: